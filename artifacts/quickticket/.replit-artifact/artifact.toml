kind = "web"
previewPath = "/"
title = "QuickTicket — IT Support"
version = "1.0.0"
id = "artifacts/quickticket"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19436

[services.development]
run = "pnpm --filter @workspace/quickticket run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quickticket", "run", "build" ]
publicDir = "artifacts/quickticket/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19436"
BASE_PATH = "/"
